name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test and package
    # WPF and the 3D simulator require Windows. The UI tests drive a real WPF
    # Application on an STA thread, so they cannot run on a Linux runner.
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BluePeakOperator.slnx

      - name: Build Release with warnings as errors
        run: dotnet build BluePeakOperator.slnx -c Release --no-restore -warnaserror

      # Domain graph analysis, the six simulator journeys, timeline evaluation
      # (forward, reverse and random access), transport and scrubbing, and the
      # gated runbook engine.
      - name: Test — domain and simulation engine
        run: >
          dotnet test tests/BluePeak.Tests/BluePeak.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=engine-tests.trx"
          --results-directory artifacts

      # Every workspace constructed and laid out, navigation, carried context,
      # and the simulator's 3D lifecycle: activation cycles, navigate away and
      # back, and frame recovery.
      - name: Test — user interface and lifecycle
        run: >
          dotnet test tests/BluePeak.UiTests/BluePeak.UiTests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=ui-tests.trx"
          --results-directory artifacts

      - name: Package — self-contained win-x64
        run: >
          dotnet publish src/BluePeak.App/BluePeak.App.csproj
          -c Release -r win-x64 --self-contained true
          -o artifacts/publish/self-contained-x64

      - name: Package — framework-dependent win-x64
        run: >
          dotnet publish src/BluePeak.App/BluePeak.App.csproj
          -c Release -r win-x64 --self-contained false
          -o artifacts/publish/framework-dependent

      # Packaged startup is a distinct failure mode from a passing build, so the
      # packaged binary is launched and made to render every workspace including
      # the 3D scene. Seventeen PNGs is the pass condition.
      - name: Verify packaged startup renders every workspace
        shell: pwsh
        run: |
          $exe = 'artifacts/publish/self-contained-x64/BluePeak.Operator.exe'
          $out = 'artifacts/ci-captures'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $exe --capture $out --capture-exit
          $count = (Get-ChildItem $out -Filter *.png).Count
          Write-Host "packaged startup rendered $count surfaces"
          if ($count -lt 17) { throw "expected 17 rendered surfaces, got $count" }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/*.trx

      - name: Upload packaged startup captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-startup-captures
          path: artifacts/ci-captures/*.png

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: BluePeak-Operator-Windows-x64
          path: artifacts/publish/self-contained-x64/
